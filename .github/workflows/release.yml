name: Build executables

on:
  # Tagging is the normal path; the manual trigger is for testing the build
  # itself without minting a release.
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing should not deny you the others.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ArbTerminal-windows
            path: build/ArbTerminal.exe
          - os: ubuntu-latest
            artifact: ArbTerminal-linux
            path: build/arbterminal
          - os: macos-latest
            artifact: ArbTerminal-macos
            path: build/arbterminal

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The executable embeds this runner's Node, so it must be a version
          # that ships node:sqlite and the SEA asset API.
          node-version: '22'
          cache: npm

      - run: npm ci

      # Never ship a binary from code whose own tests do not pass.
      - run: npm test

      # A single executable cannot be cross-built: it is a copy of the host's
      # own Node binary with a blob injected, so each platform builds its own.
      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm test

      # Capacitor regenerates the native project from config, so it is created
      # here rather than committed.
      - run: npm run build -w @arbterminal/mobile
      - run: npx cap add android
        working-directory: apps/mobile
      - run: npx cap sync android
        working-directory: apps/mobile
      - run: ./gradlew assembleDebug
        working-directory: apps/mobile/android

      - uses: actions/upload-artifact@v4
        with:
          name: ArbTerminal-android
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Name the binaries by platform
        run: |
          mkdir -p release
          cp artifacts/ArbTerminal-windows/ArbTerminal.exe release/ArbTerminal-windows.exe
          cp artifacts/ArbTerminal-linux/arbterminal    release/ArbTerminal-linux
          cp artifacts/ArbTerminal-macos/arbterminal    release/ArbTerminal-macos
          cp artifacts/ArbTerminal-android/app-debug.apk release/ArbTerminal-android.apk
          chmod +x release/ArbTerminal-linux release/ArbTerminal-macos

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            Download the file for your platform and run it. It starts a local
            server and opens ArbTerminal in your browser. Nothing needs to be
            installed.

            `ArbTerminal-android.apk` is the phone app: import a capture,
            compare it against Kalshi, see the results. Everything runs on the
            device.

            These builds are unsigned. Windows SmartScreen will warn on first
            run ("More info" then "Run anyway"), macOS Gatekeeper needs
            right-click then Open, and Android will warn about installing from
            an unknown source. Signing requires certificates this project does
            not have.

            Read-only: no order is ever placed at any venue.
