name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # :core is plain Kotlin/JVM and holds the scoring, dedup, allocation and
      # drop-timing logic, so the rules that decide what lands in a Spotlight are
      # verified without an emulator.
      - name: Core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Named with the run number so a downloaded APK can be traced back to the
      # commit it came from.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: efunny-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
